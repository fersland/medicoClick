<div class="container mb-4">
    <div class="row justify-content-center align-items-center" style="height: 100vh;">
        <div class="col-md-6">
            
            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
                {{ errorMessage }}
            </div>
            <form [formGroup]="form" (ngSubmit)="login()">
                <fieldset >
                    <legend>Inicio de Sesión</legend>
                    <hr>
                    <div class="mb-3">
                        <label for="disabledTextInput" class="form-label">* Correo Electrónico</label>
                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            formControlName="email"
                            required
                            />

                        <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-danger">
                            Ingrese un correo valido.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="disabledSelect" class="form-label">* Password</label>
                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            formControlName="password"
                            required
                            />
                        <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="text-danger">
                            Este campo es requerido.
                        </div>
                    </div>
                    <div class="mb-3">
                        <button type="submit" class="btn btn-success w-100" [disabled]="form.invalid">
                            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                            {{ loading ? 'Ingresando...' : 'Ingresar' }}
                        </button>                        
                    </div>

                    <small>
                        ¿Aún no tienes cuenta? Crea una cuenta <a [routerLink]="['/registro']">aquí</a>
                    </small>
                    
                </fieldset>
            </form>
        </div>
    </div>
</div>
