<div class="container mt-4">
    <div class="row">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">Actualizar datos de Doctores</h2>
                <a class="btn btn-primary btn-sm" [routerLink]="'/doc'">Regresar</a>
            </div>

                <form [formGroup]="doctorForm" (ngSubmit)="onSubmit()">
                    <div>
                        <label for="identificacion">Identificación</label>
                        <input 
                            id="identificacion"
                            formControlName="identificacion"
                            class="form-control"
                            type="text" />
                    </div>
                    <div>
                        <label for="primerNombre">Primer Nombre</label>
                        <input 
                            id="primerNombre"
                            formControlName="primerNombre"
                            class="form-control"
                            type="text" />
                    </div>
                    <div>
                        <label for="segundoNombre">Segundo Nombre</label>
                        <input
                            id="segundoNombre"
                            formControlName="segundoNombre"
                            class="form-control"
                            type="text" />
                    </div>
                    <div>
                        <label for="primerApellido">Primer Apellido</label>
                        <input
                            id="primerApellido"
                            formControlName="primerApellido"
                            class="form-control"
                            type="text" />
                    </div>
                    <div>
                        <label for="segundoApellido">Segundo Apellido</label>
                        <input
                            id="segundoApellido"
                            formControlName="segundoApellido"
                            class="form-control"
                            type="text" />
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input
                            id="email"
                            formControlName="email"
                            class="form-control"
                            type="email" />
                    </div>
                    <div>
                        <label for="activo">Activo</label>
                        <select 
                            formControlName="activo"
                            id="activo"
                            class="form-control">
                            <option [ngValue]="null" disabled>-- Seleccione --</option>
                            <option [ngValue]="true">Sí</option>
                            <option [ngValue]="false">No</option>
                        </select>
                    </div>
                    <div>
                        <label for="telefono">Teléfono</label>
                        <input
                            id="telefono"
                            formControlName="telefono"
                            class="form-control"
                            type="text" />
                    </div>
                    <div>
                        <label for="direccion">Dirección</label>
                        <input
                            id="direccion"
                            formControlName="direccion"
                            class="form-control"
                            type="text" />
                    </div>
                    

                    <div class="mt-3">
                        <button type="submit" class="btn btn-success">Editar Doctor</button>
                    </div>
                </form>
        </div>
    </div>
</div>
