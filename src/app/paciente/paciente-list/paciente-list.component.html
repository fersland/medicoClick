<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">Lista de Pacientes</h2>
                <a [routerLink]="['/paciente-create']" class="btn btn-primary btn-sm">Nuevo</a>
            </div>

            <div *ngIf="loading">Cargando listado..</div>
            <div *ngIf="!loading"></div>

            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Direccion</th>
                    <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let paciente of pacientes">
                        <td>{{ paciente.id }}</td>
                        <td>{{ paciente.primerNombre }} {{ paciente.primerApellido }}</td>
                        <td>{{ paciente.email }}</td>
                        <td>{{ paciente.telefono }}</td>
                        <td>{{ paciente.direccion }}</td>
                        <td>
                            <a [routerLink]="['/paciente-edit', paciente.id]" class="update-link"><i class="fas fa-edit"></i></a>
                           <a (click)="deletePaciente(paciente.id)" class="delete-link"> <i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div *ngIf="!loading && pacientes.length === 0">No hay registros disponibles.</div>
        </div>
    </div>
</div>
